services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: obraflow
      POSTGRES_USER: obraflow
      POSTGRES_PASSWORD: obraflow
    ports:
      - "55432:5432"
    volumes:
      - obraflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obraflow -d obraflow"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  obraflow-postgres-data:
